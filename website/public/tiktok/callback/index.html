<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TikTok OAuth — Process Studio</title>
  <meta name="robots" content="noindex,nofollow">
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
      background: #0a0a0b; color: #f5f5f5; padding: 24px;
    }
    .card {
      max-width: 420px; width: 100%;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 16px; padding: 28px 24px;
      background: rgba(255,255,255,.04);
    }
    h1 { font-size: 1.15rem; margin: 0 0 8px; font-weight: 650; }
    p { margin: 0 0 14px; line-height: 1.45; color: rgba(255,255,255,.72); font-size: .95rem; }
    a { color: #fff; }
    .ok { color: #7dffa4; }
    .err { color: #ff8b8b; }
    .muted { font-size: .82rem; color: rgba(255,255,255,.5); }
  </style>
</head>
<body>
  <main class="card">
    <h1 id="title">Connecting TikTok…</h1>
    <p id="msg">Finishing Process Studio OAuth on useprocess.xyz…</p>
    <p class="muted" id="hint">
      Official redirect domain: <strong>useprocess.xyz</strong> —
      <a href="/studio">Process Studio</a>
    </p>
  </main>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var code = params.get("code");
      var state = params.get("state") || "";
      var err = params.get("error") || params.get("error_description");
      var title = document.getElementById("title");
      var msg = document.getElementById("msg");

      // Never redirect off useprocess.xyz (no localhost) — required for TikTok redirect-domain review.
      if (err) {
        title.textContent = "TikTok OAuth failed";
        title.className = "err";
        msg.textContent = err;
        return;
      }

      if (!code) {
        title.textContent = "Process Studio — TikTok callback";
        msg.innerHTML = "This HTTPS page on <strong>useprocess.xyz</strong> receives TikTok Login Kit redirects. Open <a href=\"/studio\">Process Studio</a> to connect.";
        return;
      }

      // All authorized Studio flows use studio_* state from /api/tiktok/oauth/start
      if (state.indexOf("studio_") === 0) {
        title.textContent = "Process Studio";
        title.className = "ok";
        msg.textContent = "Completing connection…";
        window.location.replace("/api/tiktok/oauth/callback" + window.location.search);
        return;
      }

      // Unknown state: stay on useprocess.xyz (do NOT bridge to localhost)
      title.textContent = "Almost done";
      msg.innerHTML = "TikTok returned to <strong>useprocess.xyz</strong>. Continue in <a href=\"/studio\">Process Studio</a> and connect again if needed.";
    })();
  </script>
</body>
</html>
