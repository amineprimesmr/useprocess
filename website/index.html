<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      document.documentElement.classList.add("app-booting");
      (function () {
        var path = location.pathname.replace(/\/$/, "");
        if (path === "/studio" || path === "/studio.html") {
          document.documentElement.classList.add("page-studio");
        }
        if (path === "/affiliate" || path === "/affiliate.html") {
          document.documentElement.classList.add("page-affiliate");
        }
      })();
    </script>
    <style>
      .hidden { display: none !important; }
      html.app-booting #landing { visibility: hidden; }
      html.page-studio #landing,
      html.page-studio #page-404 { display: none !important; }
      html.page-studio #page-studio { display: block !important; }
      html.page-affiliate #landing,
      html.page-affiliate #page-404 { display: none !important; }
      html.page-affiliate #page-affiliate { display: block !important; }
    </style>
    <meta
      name="description"
      content="Process — Coach IA, scan visage et protocole debloat personnalisé. Dégonfle ton visage avec nutrition, hydratation et suivi Apple Santé."
    />

    <meta
      property="og:description"
      content="Coach IA, scan visage et protocole debloat — application iOS."
    />
    <meta property="og:url" content="https://useprocess.xyz/" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#f2f2f2" />
    <link rel="canonical" href="https://useprocess.xyz/" />
    <link rel="icon" type="image/png" href="/assets/icone.png?v=20260808" />
    <link rel="apple-touch-icon" href="/assets/icone.png?v=20260808" />
    <title>Process — Coach IA &amp; protocole debloat visage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Inter+Tight:ital,wght@0,500;0,600;0,700;1,600;1,700&family=Instrument+Sans:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/process-landing-shell.css" />
    <link rel="stylesheet" href="/src/get-app-page.css" />
    <link rel="stylesheet" href="/src/landing-footer.css" />
  </head>
  <body>
    <div id="landing">
      <main id="landing-main" class="landing-main landing-main-cinematic">
        <div id="landing-cinematic-root" class="landing-cinematic-shell"></div>
      </main>

      <footer id="site-footer-process" class="landing-footer landing-footer--sf">
        <div class="landing-footer-sf-inner">
          <nav class="landing-footer-sf-nav" aria-label="Liens pied de page">
            <a href="/cgu">CGU</a>
            <a href="/confidentialite">Confidentialité</a>
            <a href="/support">Support</a>
            <a href="/sources-sante">Sources santé</a>
          </nav>
          <div class="landing-footer-sf-bot">
            <p class="landing-footer-sf-copy">© Process</p>
          </div>
        </div>

      <main id="landing-legal" class="landing-legal hidden">
        <div class="landing-legal-inner">
          <a href="/" class="landing-btn landing-btn-secondary" style="margin-bottom: 1.5rem">← Retour</a>

    <div id="page-affiliate" class="hidden" aria-hidden="true">
