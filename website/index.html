<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      document.documentElement.classList.add("app-booting");
      (function () {
        try {
          var u = new URL(location.href);
          var looksLike =
            u.searchParams.has("oobCode") ||
            u.searchParams.get("mode") === "signIn" ||
            u.searchParams.get("emailLink") === "1";
          if (looksLike) {
            var p = u.pathname.replace(/\/$/, "") || "/";
            if (p !== "/clipping" && p !== "/clipping.html") {
              u.pathname = "/clipping";
              location.replace(u.toString());
              return;
            }
          }
        } catch (e) {}
        var path = location.pathname.replace(/\/$/, "");
        if (path === "/clipping" || path === "/clipping.html" || path === "/affiliate" || path === "/affiliate.html") {
          document.documentElement.classList.add("page-affiliate");
        }
      })();
    </script>
    <style>
      .hidden { display: none !important; }
      html.app-booting #landing { visibility: hidden; }
      html.page-affiliate,
      html.page-affiliate body {
        background: #fff !important;
        color: #0a0a0a !important;
      }
      html.page-affiliate #landing,
      html.page-affiliate #page-404 { display: none !important; }
      html.page-affiliate #page-affiliate { display: block !important; visibility: visible !important; }
      html.page-affiliate #affiliate-root { min-height: 100vh; }
    </style>
    <meta

    />

      property="og:description"
